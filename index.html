<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap" rel="stylesheet">
    <title>Profile card</title>

</head>

<body>
    <div class="card">
        <div class="card-head"></div>
        <div class="card-avatar"><img src="/images/image-victor.jpg" alt=""></div>
        <div class="card-body">
            <h2>Victor Crest <span>26</span></h2>
            <p>London</p>
            <ul class="card-stats">
                <li><strong>80K</strong><br><span>Followers</span></li>
                <li><strong>803K</strong><br><span>Likes</span></li>
                <li><strong>1.4K</strong><br><span>Photos</span></li>
            </ul>
        </div>

    </div>
</body>

</html>
